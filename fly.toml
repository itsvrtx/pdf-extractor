# Fly.io:  fly launch --no-deploy --copy-config   then   fly secrets set ACCESS_TOKEN=...   then   fly deploy
app = "pdf-extractor-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
